[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ot2-bridge"
version = "0.6.0"
description = "Thin operation mapping for OT-2 and Flex real and Matterix backends"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[project.optional-dependencies]
sila = ["sila2==0.14.0", "grpcio==1.80.0", "grpcio-tools==1.80.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ot2_bridge"]

[project.scripts]
ot2-bridge = "ot2_bridge.cli:main"

lab-bridge = "ot2_bridge.flex_cli:main"
lab-bridge-gateway = "ot2_bridge.gateway_agent:main"
lab-bridge-setup = "ot2_bridge.site_setup:main"
